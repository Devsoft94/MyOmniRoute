name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Downcase Repository Name
        run: |
          echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/omniroute:latest" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          # Allocates Node heap inside GitHub Actions runner to prevent OOM
          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=8192
